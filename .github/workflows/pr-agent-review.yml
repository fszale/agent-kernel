name: PR Agent Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  agent-review:
    name: AI Review — Governance and Traceability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get diff of changed files
        run: |
          git diff origin/${{ github.base_ref }}...HEAD --name-only > changed-files.txt
          git diff origin/${{ github.base_ref }}...HEAD > pr-diff.txt
          echo "Changed files:"
          cat changed-files.txt

      - name: Run AI review with configured LLM endpoint
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_ENDPOINT: ${{ secrets.LLM_API_ENDPOINT }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          cat > pr-review.mjs << 'EOF'
          import { readFileSync } from "fs";

          const endpoint = process.env.LLM_API_ENDPOINT;
          const apiKey = process.env.LLM_API_KEY;
          const model = process.env.LLM_MODEL;
          if (!endpoint || !apiKey || !model) {
            throw new Error("Missing required secrets: LLM_API_KEY, LLM_API_ENDPOINT, LLM_MODEL");
          }

          function flattenText(value) {
            if (typeof value === "string") {
              return value.trim();
            }
            if (Array.isArray(value)) {
              return value
                .map((item) => {
                  if (typeof item === "string") {
                    return item;
                  }
                  if (typeof item?.text === "string") {
                    return item.text;
                  }
                  if (typeof item?.content === "string") {
                    return item.content;
                  }
                  return "";
                })
                .join("\n")
                .trim();
            }
            return "";
          }

          function extractLLMText(parsed) {
            const candidates = [
              parsed?.choices?.[0]?.message?.content,
              parsed?.choices?.[0]?.text,
              parsed?.message?.content,
              parsed?.output_text,
              parsed?.content,
              parsed?.candidates?.[0]?.content?.parts?.map((part) => part?.text ?? "").join("\n"),
              parsed?.output
                ?.flatMap((item) => item?.content ?? [])
                ?.map((item) => item?.text ?? "")
                ?.join("\n")
            ];

            for (const candidate of candidates) {
              const text = flattenText(candidate);
              if (text) {
                return text;
              }
            }
            return "";
          }

          async function askLLM(promptText) {
            const response = await fetch(endpoint, {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${apiKey}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                model,
                messages: [
                  {
                    role: "system",
                    content: "You review pull requests for governance, traceability, and consistency issues."
                  },
                  { role: "user", content: promptText }
                ],
                temperature: 0.1
              })
            });

            const body = await response.text();
            if (!response.ok) {
              throw new Error(`LLM request failed: ${response.status} ${body}`);
            }
            let parsed;
            try {
              parsed = JSON.parse(body);
            } catch (error) {
              throw new Error(`LLM response was not valid JSON: ${body.slice(0, 500)}`);
            }
            const content = extractLLMText(parsed);
            if (!content) {
              throw new Error(`LLM response did not contain readable text. Body: ${body.slice(0, 1000)}`);
            }
            return content;
          }

          const diff = readFileSync("pr-diff.txt", "utf-8").substring(0, 8000);
          const changedFiles = readFileSync("changed-files.txt", "utf-8");
          const promptText = [
            "You are reviewing a pull request to the agent-kernel project.",
            "This project encodes design principles about governance, traceability, and agent behavior.",
            "",
            "Review the following diff for these specific issues:",
            "",
            "1. GOVERNANCE HIERARCHY: If new skills or prompts introduce governance concepts,",
            "   do they follow the Objective→Strategy→Tactic→Action chain?",
            "",
            "2. TRACEABILITY: Do any new agent-spec YAML files include the required fields:",
            "   - decision_rationale.universal_required_fields: [justification, decision_summary, evidence]",
            "   - tactic_alignment or strategy_alignment fields on actions?",
            "",
            "3. FRONTMATTER COMPLETENESS: Do any new SKILL.md files have all required frontmatter?",
            "   Required: name, description, when-to-use, principles",
            "",
            "4. BANNED PATTERNS: Are there any brand-specific references that should not be in generic content?",
            "",
            "5. SCHEMA CONVENTIONS: Are naming conventions followed (kebab-case for files/directories)?",
            "",
            "Report findings in this format:",
            "## ✅ Looks Good",
            "[issues that are NOT present — be brief]",
            "",
            "## ⚠️ Suggestions",
            "[non-blocking improvements with file and line reference]",
            "",
            "## ❌ Issues",
            "[blocking issues that must be fixed]",
            "",
            `Changed files: ${changedFiles}`,
            "",
            "Diff:",
            diff
          ].join("\n");

          const review = await askLLM(promptText);
          console.log(review);
          EOF
          node pr-review.mjs > pr_review_output.txt 2>&1
          cat pr_review_output.txt

      - name: Post review as PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reviewOutput = fs.readFileSync('pr_review_output.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Agent Kernel — Automated PR Review\n\n${reviewOutput}\n\n---\n*Generated by the configured LLM endpoint. Requires \`LLM_API_KEY\`, \`LLM_API_ENDPOINT\`, and \`LLM_MODEL\` secrets.*`
            });
