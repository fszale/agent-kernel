name: Prompt Quality Review

on:
  schedule:
    - cron: '0 9 * * 1'   # Every Monday at 9 AM UTC
  workflow_dispatch:

jobs:
  review-prompts:
    name: LLM-Powered Prompt Quality Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Review prompts with configured LLM endpoint
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_ENDPOINT: ${{ secrets.LLM_API_ENDPOINT }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          cat > review-prompts.mjs << 'EOF'
          import { readFileSync, readdirSync } from "fs";

          const endpoint = process.env.LLM_API_ENDPOINT;
          const apiKey = process.env.LLM_API_KEY;
          const model = process.env.LLM_MODEL;
          if (!endpoint || !apiKey || !model) {
            throw new Error("Missing required secrets: LLM_API_KEY, LLM_API_ENDPOINT, LLM_MODEL");
          }

          function flattenText(value) {
            if (typeof value === "string") {
              return value.trim();
            }
            if (Array.isArray(value)) {
              return value
                .map((item) => {
                  if (typeof item === "string") {
                    return item;
                  }
                  if (typeof item?.text === "string") {
                    return item.text;
                  }
                  if (typeof item?.content === "string") {
                    return item.content;
                  }
                  return "";
                })
                .join("\n")
                .trim();
            }
            return "";
          }

          function extractLLMText(parsed) {
            const candidates = [
              parsed?.choices?.[0]?.message?.content,
              parsed?.choices?.[0]?.text,
              parsed?.message?.content,
              parsed?.output_text,
              parsed?.content,
              parsed?.candidates?.[0]?.content?.parts?.map((part) => part?.text ?? "").join("\n"),
              parsed?.output
                ?.flatMap((item) => item?.content ?? [])
                ?.map((item) => item?.text ?? "")
                ?.join("\n")
            ];

            for (const candidate of candidates) {
              const text = flattenText(candidate);
              if (text) {
                return text;
              }
            }
            return "";
          }

          async function askLLM(promptText) {
            const response = await fetch(endpoint, {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${apiKey}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                model,
                messages: [
                  {
                    role: "system",
                    content: "You review prompt templates for clarity, governance alignment, and output quality."
                  },
                  { role: "user", content: promptText }
                ],
                temperature: 0.2
              })
            });

            const body = await response.text();
            if (!response.ok) {
              throw new Error(`LLM request failed: ${response.status} ${body}`);
            }
            let parsed;
            try {
              parsed = JSON.parse(body);
            } catch (error) {
              throw new Error(`LLM response was not valid JSON: ${body.slice(0, 500)}`);
            }
            const content = extractLLMText(parsed);
            if (!content) {
              throw new Error(`LLM response did not contain readable text. Body: ${body.slice(0, 1000)}`);
            }
            return content;
          }

          const promptFiles = readdirSync("prompts").filter((f) => f.endsWith(".md"));
          const findings = [];

          for (const file of promptFiles) {
            const content = readFileSync(`prompts/${file}`, "utf-8");
            const promptText = [
              "You are reviewing a prompt template for an agent-kernel project.",
              "The prompts should align with these principles:",
              "- People · Process · Technology (PPT) framework",
              "- Pareto (80/20) — focus on highest value",
              "- 30/60/90 mindset — time horizons",
              "- Bias towards action — outputs should be concrete and actionable",
              "- Rate of Improvement — measurement focus",
              "",
              "Review this prompt template and identify:",
              "1. Clarity issues (ambiguous instructions or variables)",
              "2. Principle alignment gaps (is it aligned with the design philosophy?)",
              "3. Output quality (is the expected output concrete enough?)",
              "4. One specific improvement suggestion",
              "",
              "Be concise. Maximum 4 bullet points total.",
              "",
              `Prompt file: ${file}`,
              "",
              "Content:",
              content.substring(0, 3000)
            ].join("\n");

            const review = await askLLM(promptText);
            const reviewLower = review.toLowerCase();
            if (
              reviewLower.includes("issue") ||
              reviewLower.includes("improve") ||
              reviewLower.includes("unclear")
            ) {
              findings.push({ file, feedback: review });
            }
          }

          if (findings.length > 0) {
            console.log("PROMPT_FINDINGS<<EOF");
            for (const f of findings) {
              console.log(`\n### ${f.file}\n${f.feedback}`);
            }
            console.log("EOF");
          } else {
            console.log("All prompts reviewed — no significant issues found.");
          }
          EOF
          node review-prompts.mjs > review_output.txt 2>&1
          cat review_output.txt

      - name: Create GitHub issue if findings exist
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('review_output.txt', 'utf8');
            if (output.includes('###')) {
              const today = new Date().toISOString().split('T')[0];
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Weekly Prompt Quality Review — ${today}`,
                body: `## Automated Prompt Quality Review\n\nGenerated by the configured LLM endpoint.\n\n${output}`,
                labels: ['prompt-quality', 'automated']
              });
            }
