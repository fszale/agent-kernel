name: Skill Consistency Check

on:
  push:
    paths:
      - 'skills/**'
      - 'prompts/**'
      - 'templates/**'
      - 'docs/**'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'PHILOSOPHY.md'
  pull_request:
    paths:
      - 'skills/**'
      - 'prompts/**'
      - 'templates/**'
      - 'docs/**'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'PHILOSOPHY.md'

jobs:
  check-skills:
    name: Validate Skill Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run contract validator
        run: python3 scripts/validate_contracts.py

  check-prompts:
    name: Validate Prompt Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run contract validator
        run: python3 scripts/validate_contracts.py
