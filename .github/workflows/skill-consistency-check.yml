name: Skill Consistency Check

on:
  push:
    paths:
      - 'skills/**'
      - 'prompts/**'
      - 'templates/**'
      - 'docs/**'
      - '.agents/**'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'CONTEXT.md'
      - 'README.md'
      - 'PHILOSOPHY.md'
  pull_request:
    paths:
      - 'skills/**'
      - 'prompts/**'
      - 'templates/**'
      - 'docs/**'
      - '.agents/**'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'CONTEXT.md'
      - 'README.md'
      - 'PHILOSOPHY.md'

jobs:
  contract-check:
    name: Validate Repository Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run contract validator
        run: python3 scripts/validate_contracts.py
