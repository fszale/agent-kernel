name: Content Improvement

on:
  schedule:
    - cron: '0 9 * * 3'   # Every Wednesday at 9 AM UTC
  workflow_dispatch:

jobs:
  gap-analysis:
    name: LLM Gap Analysis — New Skill and Prompt Suggestions
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run gap analysis with configured LLM endpoint
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_ENDPOINT: ${{ secrets.LLM_API_ENDPOINT }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          export EXISTING_SKILLS="$(ls skills/)"
          export EXISTING_PROMPTS="$(ls prompts/)"

          cat > gap-analysis.mjs << 'EOF'
          const endpoint = process.env.LLM_API_ENDPOINT;
          const apiKey = process.env.LLM_API_KEY;
          const model = process.env.LLM_MODEL;
          if (!endpoint || !apiKey || !model) {
            throw new Error("Missing required secrets: LLM_API_KEY, LLM_API_ENDPOINT, LLM_MODEL");
          }

          function flattenText(value) {
            if (typeof value === "string") {
              return value.trim();
            }
            if (Array.isArray(value)) {
              return value
                .map((item) => {
                  if (typeof item === "string") {
                    return item;
                  }
                  if (typeof item?.text === "string") {
                    return item.text;
                  }
                  if (typeof item?.content === "string") {
                    return item.content;
                  }
                  return "";
                })
                .join("\n")
                .trim();
            }
            return "";
          }

          function extractLLMText(parsed) {
            const candidates = [
              parsed?.choices?.[0]?.message?.content,
              parsed?.choices?.[0]?.text,
              parsed?.message?.content,
              parsed?.output_text,
              parsed?.content,
              parsed?.candidates?.[0]?.content?.parts?.map((part) => part?.text ?? "").join("\n"),
              parsed?.output
                ?.flatMap((item) => item?.content ?? [])
                ?.map((item) => item?.text ?? "")
                ?.join("\n")
            ];

            for (const candidate of candidates) {
              const text = flattenText(candidate);
              if (text) {
                return text;
              }
            }
            return "";
          }

          async function askLLM(promptText) {
            const response = await fetch(endpoint, {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${apiKey}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                model,
                messages: [
                  {
                    role: "system",
                    content: "You are a content strategist for reusable AI toolkits."
                  },
                  { role: "user", content: promptText }
                ],
                temperature: 0.2
              })
            });

            const body = await response.text();
            if (!response.ok) {
              throw new Error(`LLM request failed: ${response.status} ${body}`);
            }
            let parsed;
            try {
              parsed = JSON.parse(body);
            } catch (error) {
              throw new Error(`LLM response was not valid JSON: ${body.slice(0, 500)}`);
            }
            const content = extractLLMText(parsed);
            if (!content) {
              throw new Error(`LLM response did not contain readable text. Body: ${body.slice(0, 1000)}`);
            }
            return content;
          }

          const existingSkills = process.env.EXISTING_SKILLS || "";
          const existingPrompts = process.env.EXISTING_PROMPTS || "";
          const philosophy = [
            "Core philosophy encoded in this kit:",
            "1. People · Process · Technology (PPT) evaluation framework",
            "2. Pareto (80/20) — focus on highest value 20% of work",
            "3. 30/60/90 mindset — horizon-based planning",
            "4. First Principles — strip assumptions, rebuild from base elements",
            "5. Bias Towards Action — anti-paralysis",
            "6. Lead With Empathy — authentic caring leadership",
            "7. Radical Candor — caring + direct feedback",
            "8. Knowledge Sprints — athlete-style deep work",
            "9. AI Use Case Scoring — 5-dimension weighted matrix",
            "10. Business Data Analysis — raw data to opportunities",
            "11. Outcome Probability — 4-factor Go/No-Go",
            "12. Rate of Improvement — S-curve measurement",
            "13. Governance Hierarchy — Obj→Strategy→Tactic→Action traceability",
            "14. HITL and Guardrails — human oversight in autonomous systems",
            "15. Autonomy Ladder — L0-L3 progressive autonomy",
            "16. Tactic Design — action bundling patterns",
            "17. Confidence and Experiment Design — calibrated scoring"
          ].join("\n");

          const promptText = [
            "You are a content strategist for an agent-kernel (reusable AI toolkit).",
            "",
            "The kit encodes these design principles:",
            philosophy,
            "",
            `Existing skills: ${existingSkills}`,
            `Existing prompts: ${existingPrompts}`,
            "",
            "Identify:",
            "1. Top 3 MISSING SKILLS — skills that would meaningfully extend the kit based on the philosophy",
            "2. Top 2 MISSING PROMPTS — prompt templates that would complement existing skills",
            "3. Top 1 CROSS-REFERENCE GAP — a skill and prompt that should reference each other but do not",
            "",
            "Be very specific. For each suggestion, explain:",
            "- Name (kebab-case)",
            "- Which principle from the philosophy it encodes",
            "- One sentence on why it is valuable",
            "",
            "Format as a markdown list."
          ].join("\n");

          const result = await askLLM(promptText);
          console.log(result);
          EOF
          node gap-analysis.mjs > gap_output.txt 2>&1
          NODE_EXIT=$?
          cat gap_output.txt
          exit $NODE_EXIT

      - name: Create GitHub issue with suggestions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('gap_output.txt', 'utf8');
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly Content Gap Analysis — ${today}`,
              body: `## Automated Content Gap Analysis\n\nSuggestions generated by the configured LLM endpoint.\n\n${output}`,
              labels: ['content-improvement', 'automated']
            });
