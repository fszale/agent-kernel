name: Documentation Sync

on:
  push:
    paths:
      - 'skills/**'
      - 'prompts/**'
      - 'templates/**'
      - 'docs/**'
      - '.agents/**'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTEXT.md'
      - 'PHILOSOPHY.md'
  pull_request:
    paths:
      - 'skills/**'
      - 'prompts/**'
      - 'templates/**'
      - 'docs/**'
      - '.agents/**'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTEXT.md'
      - 'PHILOSOPHY.md'

concurrency:
  group: documentation-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-check:
    name: Verify README Index Completeness
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Auto-heal diagram embeds
        run: python3 scripts/embed_diagrams.py

      - name: Commit auto-healed changes
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v5
        continue-on-error: true
        with:
          commit_message: "chore: auto-heal diagram embeds [skip ci]"
          file_pattern: 'AGENTS.md CONTEXT.md PHILOSOPHY.md README.md docs/*.md .agents/skills/*.md'

      - name: Note auto-commit race conditions
        if: steps.auto_commit.outcome != 'success'
        run: |
          echo "::warning::Auto-heal changes were created locally but could not be pushed cleanly. This usually means the branch moved while the workflow was running."

      - name: Check all skills are listed in AGENTS.md
        run: |
          FAILED=0
          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")
            if ! grep -q "$skill_name" AGENTS.md; then
              echo "❌ Skill '$skill_name' is missing from AGENTS.md"
              FAILED=1
            fi
          done
          if [ $FAILED -eq 0 ]; then
            echo "✅ All skills referenced in AGENTS.md"
          fi
          exit $FAILED

      - name: Check all prompts are in .agents/skills/project-navigation.md
        run: |
          FAILED=0
          for prompt_file in prompts/*.md; do
            prompt_name=$(basename "$prompt_file")
            if ! grep -q "$prompt_name" .agents/skills/project-navigation.md; then
              echo "⚠️  Prompt '$prompt_name' not listed in project-navigation.md"
              # Not a hard failure — warning only
            fi
          done
          echo "✅ Prompt listing check complete"

      - name: Check all templates are in .agents/skills/project-navigation.md
        run: |
          for template_file in templates/*; do
            template_name=$(basename "$template_file")
            if ! grep -q "$template_name" .agents/skills/project-navigation.md; then
              echo "⚠️  Template '$template_name' not listed in project-navigation.md"
            fi
          done
          echo "✅ Template listing check complete"

      - name: Validate YAML files
        run: |
          npm install -g js-yaml
          echo "Validating YAML files..."
          FAILED=0
          for yaml_file in templates/*.yaml .github/workflows/*.yml; do
            if ! js-yaml "$yaml_file" > /dev/null 2>&1; then
              echo "❌ Invalid YAML: $yaml_file"
              FAILED=1
            else
              echo "✅ Valid: $yaml_file"
            fi
          done
          exit $FAILED

      - name: Run repository contract validator
        run: python3 scripts/validate_contracts.py
